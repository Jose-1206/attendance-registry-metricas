openapi: 3.1.0

info:
  title: Attendance Authentication API
  description: |
    Student registration and authentication for Attendance Registry.
    Public registration does not grant teacher privileges.
    Teacher accounts are provisioned through controlled development seeds.

    Registration and login were verified against the authentication
    implementation and an isolated PostgreSQL database.
    This verification does not establish that the implementation has
    already been merged into develop or qa.
  version: 1.0.0

servers:
  - url: /api/v1

security: []

tags:
  - name: Authentication
    description: Registration and login operations.

paths:
  /auth/register:
    post:
      operationId: registerStudent
      tags:
        - Authentication
      summary: Register a student account
      description: |
        Creates a student account and returns its public information.
        Email addresses are normalized and must be unique.
        Passwords are stored as BCrypt hashes.

        The role is optional and defaults to STUDENT when omitted or null.
        Requesting TEACHER through public registration returns 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Student account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: |
            Invalid fields, unsupported role value or password exceeding
            the 72-byte UTF-8 limit.
        "403":
          description: Public registration cannot create teacher accounts.
        "409":
          description: Account conflicts with existing data, including duplicate email.

  /auth/login:
    post:
      operationId: login
      tags:
        - Authentication
      summary: Authenticate a user
      description: |
        Validates the email and password and returns a signed bearer JWT
        with public user information.

        Tokens use HS256, the configured issuer and a default lifetime
        of 3600 seconds. Both students and teachers can log in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request fields or password exceeding 72 UTF-8 bytes.
        "401":
          description: Invalid credentials.

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - nombre
        - email
        - password
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          pattern: '\S'
          example: Demo Student
        email:
          type: string
          format: email
          maxLength: 254
          example: student@example.test
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          pattern: '\S'
          description: |
            Must contain a non-whitespace character and must not exceed
            72 bytes when encoded as UTF-8.
        rol:
          type:
            - string
            - "null"
          enum:
            - STUDENT
            - TEACHER
            - null
          description: |
            Omitted or null values create a STUDENT.
            STUDENT is the only role allowed for successful public
            registration. TEACHER requests return 403.
          example: STUDENT

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: teacher.owner@example.test
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          pattern: '\S'
          description: Must not exceed 72 UTF-8 bytes.

    AuthResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: |
            Signed JWT sent in the Authorization header as Bearer token.
            Do not log or publish real tokens.
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required:
        - id
        - nombre
        - email
        - rol
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 3
        nombre:
          type: string
          example: Demo Teacher Owner
        email:
          type: string
          format: email
          example: teacher.owner@example.test
        rol:
          type: string
          enum:
            - STUDENT
            - TEACHER
          example: TEACHER