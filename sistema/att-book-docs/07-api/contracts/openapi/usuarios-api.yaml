openapi: 3.1.0

info:
  title: Attendance Users API
  description: |
    Authenticated profile retrieval for Attendance Registry.
    Verified through HTTP security tests and manual PostgreSQL checks.

    This contract currently documents profile retrieval only.
    It does not represent a complete user administration CRUD.
  version: 1.0.0

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: Users
    description: Authenticated user information.

paths:
  /usuarios/me:
    get:
      operationId: getCurrentUser
      tags:
        - Users
      summary: Retrieve the authenticated profile
      description: |
        Returns the database user identified by the validated JWT.
        Both STUDENT and TEACHER roles can retrieve their own profile.
        Passwords and password hashes are never returned.
      responses:
        "200":
          description: Authenticated profile retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid or expired bearer token.
        "404":
          description: The authenticated user no longer exists in the database.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required:
        - id
        - nombre
        - email
        - rol
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 3
        nombre:
          type: string
          example: Demo Teacher Owner
        email:
          type: string
          format: email
          example: teacher.owner@example.test
        rol:
          type: string
          enum:
            - STUDENT
            - TEACHER
          example: TEACHER