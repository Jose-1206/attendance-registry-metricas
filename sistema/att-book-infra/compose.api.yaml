services:
  api:
    build:
      context: ${API_SOURCE_DIR:-../att-book-api}
      dockerfile: ${API_DOCKERFILE:-../att-book-infra/docker/api/Dockerfile}
    environment:
      SERVER_PORT: "8080"
      DB_URL: "${DB_URL:?Set DB_URL}"
      DB_USERNAME: "${DB_USERNAME:?Set DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
    networks:
      - backend
    init: true

networks:
  backend:
    external: true
    name: "${API_NETWORK:-att-book-backend}"