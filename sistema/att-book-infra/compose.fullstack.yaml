
# Attendance Registry
# Full Stack Development Environment

name: att-book-fullstack

services:

  # ====================================
  # POSTGRESQL DATABASE
  # ====================================
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: attbook
      POSTGRES_USER: attbook
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../att-book-db/migrations:/docker-entrypoint-initdb.d:ro

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U attbook -d attbook
      interval: 10s
      timeout: 5s
      retries: 10

  # ====================================
  # SPRING BOOT API
  # ====================================
  api:
    build:
      context: ../att-book-api
      dockerfile: ../att-book-infra/docker/api/Dockerfile

    restart: unless-stopped

    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/attbook
      DB_USERNAME: attbook
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

    init: true

  # ====================================
  # REACT FRONTEND + NGINX
  # ====================================
  portal:
    build:
      context: ../att-book-portal
      dockerfile: ../att-book-infra/docker/portal/Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8086:80"

    volumes:
      - ./docker/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - api

    networks:
      - backend

    init: true

# ====================================
# NETWORKS
# ====================================
networks:
  backend:
    driver: bridge

# ====================================
# PERSISTENT VOLUMES
# ====================================
volumes:
  postgres_data:
