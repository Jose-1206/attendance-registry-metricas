services:
  portal:
    build:
      context: ${PORTAL_SOURCE_DIR:-../att-book-portal}
      dockerfile: ${PORTAL_DOCKERFILE:-../att-book-infra/docker/portal/Dockerfile}
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - ./docker/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/health
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    init: true

networks:
  backend:
    external: true
    name: "${API_NETWORK:-att-book-backend}"